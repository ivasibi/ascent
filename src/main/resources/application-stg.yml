logging:
  level:
    root: debug
  file:
    name: ./logs/ascent-stg.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 31
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${AE_MYSQL_DATABASE}
    username: ${AE_MYSQL_USER}
    password: ${AE_MYSQL_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${AE_REDIS_PASSWORD}
  jpa:
    show-sql: true