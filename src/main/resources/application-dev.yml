logging:
  level:
    org.ascent: debug
  file:
    name: ./logs/ascent-dev.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7
      file-name-pattern: ./logs/ascent-dev.%d{yyyy-MM-dd}.%i.log.zip
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ascent-dev
    username: ascent-dev
    password: ascent-dev
  data:
    redis:
      host: localhost
      port: 6379
      password: ascent-dev